name: SeryxTuner
options:
  bundleIdPrefix: gg.seryx
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  SeryxTuner:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.seryx.tuner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ECU Tuner"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to your OBD Bluetooth adapter to send tuning settings to your own ECU."
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
