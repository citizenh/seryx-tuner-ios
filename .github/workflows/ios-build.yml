name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned archive)
        run: |
          xcodebuild \
            -project SeryxTuner.xcodeproj \
            -scheme SeryxTuner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SeryxTuner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/SeryxTuner.xcarchive/Products/Applications/SeryxTuner.app build/Payload/
          cd build && zip -qr SeryxTuner-unsigned.ipa Payload
          ls -la build || true

      - name: Render SwiftUI preview in a simulator
        continue-on-error: true
        run: |
          set -e
          xcodebuild \
            -project SeryxTuner.xcodeproj \
            -scheme SeryxTuner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simdd \
            build CODE_SIGNING_ALLOWED=NO
          APP=$(find simdd -name 'SeryxTuner.app' -type d | head -1)
          echo "app: $APP"
          RT=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ )]*' | tail -1)
          DT=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[5-6]' | tail -1)
          echo "runtime=$RT devicetype=$DT"
          UDID=$(xcrun simctl create preview "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" gg.seryx.tuner
          sleep 6
          xcrun simctl io "$UDID" screenshot build/preview.png
          ls -la build/preview.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SeryxTuner-build
          path: |
            build/SeryxTuner-unsigned.ipa
            build/preview.png
          if-no-files-found: warn

      - name: Publish to public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest dev build
          files: |
            build/SeryxTuner-unsigned.ipa
            build/preview.png
